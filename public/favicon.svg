<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ballshine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="42" fill="#0e2417" />
  <rect x="0" y="0" width="200" height="200" rx="42" fill="#1f7a4d" opacity="0.55" />

  <ellipse cx="100" cy="150" rx="58" ry="14" fill="#000000" opacity="0.25" />

  <!-- Blue 2-ball (back left) -->
  <g>
    <circle cx="64" cy="86" r="44" fill="#1E5FCC" />
    <circle cx="64" cy="86" r="21" fill="#ffffff" />
    <text x="64" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E5FCC">2</text>
    <circle cx="64" cy="86" r="44" fill="url(#ballshine)" />
  </g>

  <!-- Red 3-ball (back right) -->
  <g>
    <circle cx="136" cy="86" r="44" fill="#D0332B" />
    <circle cx="136" cy="86" r="21" fill="#ffffff" />
    <text x="136" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#D0332B">3</text>
    <circle cx="136" cy="86" r="44" fill="url(#ballshine)" />
  </g>

  <!-- Black 8-ball (front center) -->
  <g>
    <circle cx="100" cy="128" r="50" fill="#161616" />
    <circle cx="100" cy="128" r="23" fill="#ffffff" />
    <text x="100" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#161616">8</text>
    <circle cx="100" cy="128" r="50" fill="url(#ballshine)" />
  </g>
</svg>
